name: Daily Knowledge Update

on:
  schedule:
    # 每天 UTC 0:00 运行（北京时间 08:00），美国 runner 可访问维基百科
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate today.json
        run: node gen_today.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add today.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "daily: update today.json for $(date -u +%Y-%m-%d)"
            git push
          fi
