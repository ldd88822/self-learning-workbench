<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>自我学习工作台</title>
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22%E8%87%AA%E6%88%91%E5%AD%A6%E4%B9%A0%E5%B7%A5%E4%BD%9C%E5%8F%B0%22%2C%22short_name%22%3A%22%E5%AD%A6%E4%B9%A0%E5%8F%B0%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f5f0e8%22%2C%22theme_color%22%3A%22%23c45a3c%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20100%20100'%3E%3Ctext%20y%3D'.9em'%20font-size%3D'90'%3E%F0%9F%93%9A%3C%2Ftext%3E%3C%2Fsvg%3E%22%2C%22sizes%22%3A%22100x100%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background:#f5f0e8; color:#2e241f; min-height:100vh; display:flex; flex-direction:column; }
    header { background:#c45a3c; color:#fff; padding:1rem 1.2rem; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 8px rgba(0,0,0,0.1); position:sticky; top:0; z-index:10; }
    header h1 { font-size:1.4rem; font-weight:600; display:flex; align-items:center; gap:0.4rem; }
    .tab-bar { display:flex; background:#fff; position:sticky; top:3.7rem; z-index:9; border-bottom:1px solid #e0d7cc; }
    .tab { flex:1; text-align:center; padding:0.8rem 0.4rem; font-weight:600; color:#8b7a6b; border-bottom:3px solid transparent; transition:0.2s; cursor:pointer; font-size:0.95rem; }
    .tab.active { color:#c45a3c; border-bottom-color:#c45a3c; }
    .container { flex:1; padding:1.2rem; max-width:640px; margin:0 auto; width:100%; overflow-y:auto; }
    .card { background:#fff; border-radius:20px; padding:1.5rem; box-shadow:0 6px 18px rgba(0,0,0,0.04); margin-bottom:1.2rem; }
    .badge { display:inline-block; font-size:0.75rem; padding:0.25rem 0.9rem; border-radius:20px; font-weight:700; margin-bottom:0.8rem; letter-spacing:0.3px; }
    .badge.world { background:#dde7f0; color:#1e4a7a; }
    .badge.china { background:#f2e6dc; color:#8b5e3c; }
    .badge.mao { background:#fde8e0; color:#b53b2c; }
    .badge.ai { background:#e2f0e5; color:#206a3e; }
    .title { font-size:1.2rem; font-weight:700; margin-bottom:0.5rem; line-height:1.4; }
    .content { color:#4a3f38; line-height:1.7; margin-bottom:1rem; font-size:0.95rem; }
    .source { font-size:0.8rem; color:#a69484; font-style:italic; margin-bottom:0.8rem; }
    .btn-group { display:flex; gap:0.5rem; margin-top:0.8rem; flex-wrap:wrap; }
    .btn { padding:0.6rem 1.2rem; border-radius:30px; font-weight:600; border:none; cursor:pointer; font-size:0.85rem; transition:0.2s; display:inline-flex; align-items:center; gap:0.3rem; background:transparent; }
    .btn-primary { background:#c45a3c; color:#fff; }
    .btn-primary:active { background:#a8432e; }
    .btn-outline { border:2px solid #c45a3c; color:#c45a3c; }
    .btn-outline:active { background:rgba(196,90,60,0.05); }
    .btn-small { padding:0.4rem 0.9rem; font-size:0.8rem; }
    .library-list { list-style:none; }
    .lib-item { background:#fff; border-radius:16px; padding:1rem 1.2rem; margin-bottom:0.7rem; box-shadow:0 2px 8px rgba(0,0,0,0.03); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem; }
    .lib-text { flex:1; min-width:160px; }
    .lib-actions { display:flex; gap:0.4rem; }
    .empty-state { text-align:center; padding:3.5rem 1rem; color:#a69484; }
    .install-banner { background:#fff7e0; border-left:4px solid #f0b429; border-radius:12px; padding:0.8rem 1rem; margin-bottom:1.2rem; font-size:0.9rem; display:none; align-items:center; gap:0.5rem; }
    .install-banner button { background:none; border:none; font-size:1.2rem; cursor:pointer; margin-left:auto; color:#8b7a6b; }
    .counter { font-size:0.8rem; color:#a69484; margin-bottom:0.8rem; }
    .multi-card-grid { display: flex; flex-direction: column; gap: 1rem; }
    @media (max-width:400px) { .btn { padding:0.5rem 1rem; font-size:0.8rem; } }
    /* 聊天助手 */
    .chat-box { display:flex; flex-direction:column; height: calc(100vh - 200px); min-height:340px; }
    .chat-scroll { flex:1; overflow-y:auto; padding:0.5rem 0; display:flex; flex-direction:column; }
    .chat-msg { max-width:85%; padding:0.7rem 1rem; border-radius:16px; margin-bottom:0.7rem; line-height:1.65; font-size:0.92rem; white-space:pre-wrap; word-break:break-word; }
    .chat-msg.user { align-self:flex-end; background:#c45a3c; color:#fff; border-bottom-right-radius:4px; }
    .chat-msg.bot { align-self:flex-start; background:#fff; color:#2e241f; border-bottom-left-radius:4px; box-shadow:0 2px 8px rgba(0,0,0,0.04); }
    .chat-msg.bot.error { background:#fde8e0; color:#b53b2c; }
    .chat-input-row { display:flex; gap:0.5rem; margin-top:0.5rem; }
    .chat-input { flex:1; border:2px solid #e0d7cc; border-radius:20px; padding:0.6rem 1rem; font-size:0.92rem; outline:none; font-family:inherit; }
    .chat-input:focus { border-color:#c45a3c; }
    .chat-key-setup { background:#fff; border-radius:20px; padding:1.5rem; box-shadow:0 6px 18px rgba(0,0,0,0.04); }
    .chat-key-setup input { width:100%; border:2px solid #e0d7cc; border-radius:12px; padding:0.6rem; margin:0.6rem 0; font-family:inherit; font-size:0.95rem; }
    .chat-quick { display:flex; gap:0.4rem; flex-wrap:wrap; margin-top:0.4rem; }

    /* ===== 悬浮 AI 助手（动漫头像） ===== */
    .ai-float-avatar {
      position:fixed; right:18px; bottom:18px; z-index:9999;
      width:80px; height:90px; border-radius:18px 18px 28px 28px;
      overflow:hidden; cursor:pointer;
      box-shadow:0 4px 20px rgba(196,90,60,0.35), 0 2px 8px rgba(0,0,0,0.15);
      border:2.5px solid #fff; transition:transform 0.3s ease, box-shadow 0.3s ease;
      animation:aiAvatarPulse 2.5s ease-in-out infinite;
      background:#fff;
    }
    .ai-float-avatar:hover { transform:scale(1.08); box-shadow:0 6px 28px rgba(196,90,60,0.45), 0 3px 12px rgba(0,0,0,0.2); }
    .ai-float-avatar img { width:100%; height:100%; object-fit:cover; display:block; }
    .ai-float-avatar .ai-badge {
      position:absolute; bottom:-2px; right:-2px;
      width:22px; height:22px; background:#c45a3c; color:#fff;
      border-radius:50%; font-size:12px; display:flex; align-items:center; justify-content:center;
      border:2px solid #fff; font-weight:700;
    }

    @keyframes aiAvatarPulse {
      0%,100% { box-shadow:0 4px 20px rgba(196,90,60,0.35), 0 2px 8px rgba(0,0,0,0.15); }
      50% { box-shadow:0 6px 28px rgba(196,90,60,0.55), 0 4px 16px rgba(0,0,0,0.25); }
    }

    /* 弹出聊天面板 */
    .ai-chat-popup {
      position:fixed; right:18px; bottom:116px; z-index:9998;
      width:380px; max-width:calc(100vw - 36px);
      height:520px; max-height:calc(100vh - 130px);
      background:#fff; border-radius:20px;
      box-shadow:0 10px 40px rgba(0,0,0,0.18), 0 2px 12px rgba(0,0,0,0.08);
      display:none; flex-direction:column; overflow:hidden;
      animation:aiPopupIn 0.3s ease;
      border:1px solid #e8dfd4;
    }
    .ai-chat-popup.open { display:flex; }
    @keyframes aiPopupIn { from{opacity:0; transform:translateY(16px) scale(0.96);} to{opacity:1; transform:translateY(0) scale(1);} }

    .ai-popup-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:0.9rem 1.1rem; background:linear-gradient(135deg,#c45a3c,#d4715a); color:#fff;
      flex-shrink:0;
    }
    .ai-popup-header .ai-name { font-weight:700; font-size:1rem; display:flex; align-items:center; gap:0.4rem; }
    .ai-popup-header .ai-close {
      width:28px; height:28px; border-radius:50%; border:none; background:rgba(255,255,255,0.2);
      color:#fff; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
      transition:background 0.2s;
    }
    .ai-popup-header .ai-close:hover { background:rgba(255,255,255,0.35); }

    .ai-popup-body { flex:1; overflow:hidden; display:flex; flex-direction:column; }
    .ai-popup-body .chat-box { height:100%; min-height:0; }
  </style>
</head>
<body>
<header>
  <h1>📚 自我学习台</h1>
  <span style="font-size:0.9rem; opacity:0.9;">每日四知</span>
</header>
<div class="tab-bar">
  <div class="tab active" data-tab="today">✨ 今日推送</div>
  <div class="tab" data-tab="library">📖 学习库 <span id="libCount" style="font-size:0.7rem; background:#c45a3c; color:#fff; padding:0.1rem 0.5rem; border-radius:10px; margin-left:0.2rem; display:none;">0</span></div>
  <div class="tab" data-tab="chat">💬 聊天助手</div>
</div>
<div class="container" id="app-container"></div>

<!-- 悬浮 AI 助手（动漫头像） -->
<div class="ai-float-avatar" id="aiFloatAvatar" title="点击与 AI 助手对话">
  <img src="./avatar.jpg" alt="AI 助手" />
  <div class="ai-badge">💬</div>
</div>
<div class="ai-chat-popup" id="aiChatPopup">
  <div class="ai-popup-header">
    <div class="ai-name">🤖 AI 学习助手</div>
    <button class="ai-close" id="aiPopupClose">✕</button>
  </div>
  <div class="ai-popup-body" id="aiPopupBody"></div>
</div>

<script>
(function() {
  // ==================== 知识库（30条，四大分类） ====================
  const knowledgeBase = [
    // 🌍 世界历史 (8条)
    { id:1, cat:'world', title:'苏格拉底的诘问', content:'苏格拉底（前469—前399）生活在雅典民主的黄金时代。他从不讲授现成答案，而是在市集与人对话，不断追问“什么是勇敢、什么是正义、什么是美德”，用层层反问逼人察觉自己的无知——这便是“精神助产术”。雅典人认为他败坏青年、不敬城邦之神，将他送上法庭判处死刑，他饮下毒堇汁从容赴死。弟子柏拉图把对话记录下来，开创了西方理性思辨的传统，苏格拉底也由此被称为“西方哲学之父”。', source:'《西方哲学史》' },
    { id:2, cat:'world', title:'罗马共和国的兴衰', content:'公元前509年，罗马人驱逐末代国王，建立共和国，实行元老院、执政官与公民大会相互制衡，并颁布《十二铜表法》约束贵族特权。凭借公民兵制与Engineering，罗马逐步征服意大利、迦太基与地中海东岸。但扩张带来奴隶激增、小农破产与军阀崛起：格拉古兄弟改革被杀，马略与苏拉内战，凯撒越过卢比孔河成为终身独裁官。公元前27年，屋大维被尊为“奥古斯都”，共和落幕，帝国开启。', source:'世界历史专题' },
    { id:3, cat:'world', title:'文艺复兴与人文主义', content:'14世纪，富足的意大利城邦（如佛罗伦萨的美第奇家族）成为文艺复兴的摇篮。拜占庭学者西迁带来大量古希腊罗马文献，人们重新发现“人”的价值，主张以人为中心、而非以神为中心。但丁、彼特拉克唤醒文学，达·芬奇、米开朗基罗、拉斐尔登峰造极，北方有伊拉斯谟与莎士比亚。这场思潮不仅催生了艺术高峰，更为后来的科学革命与宗教改革埋下火种，被视为现代世界的序幕。', source:'欧洲文化史' },
    { id:4, cat:'world', title:'法国大革命的思想前奏', content:'波旁王朝的奢侈与财政破产，让法国危机四伏。一批思想家挺身而出：伏尔泰抨击教权、倡导自由；孟德斯鸠提出立法、行政、司法“三权分立”；卢梭在《社会契约论》中喊出“主权在民”。狄德罗主编的《百科全书》把这些观念播散到民间。当1789年三级会议召开、巴士底狱被攻陷，《人权宣言》宣告“人生而自由平等”，一场以理性为旗帜的革命就此点燃，其浪潮随即席卷全欧。', source:'启蒙运动史' },
    { id:5, cat:'world', title:'工业革命改变世界', content:'18世纪60年代，工业革命从英国起步。其前提是一连串积累：圈地运动提供了自由劳动力，海外殖民地打开市场，本土煤铁资源充足，专利法保护发明。1769年瓦特改良蒸汽机，机器首次拥有稳定的动力；珍妮纺纱机让棉纺织业率先腾飞，1825年史蒂芬森的蒸汽机车又拉开铁路时代。社会被彻底重塑：人口涌向城市、工人阶级诞生、污染与贫富对立加剧。这股浪潮随后扩散到欧美，奠定了现代资本主义的面貌。', source:'全球经济史' },
    { id:6, cat:'world', title:'美国独立与《独立宣言》', content:'七年战争后，英国为填补军费向北美殖民地开征印花税，殖民地以“无代表不纳税”奋起抗议。1775年列克星敦枪声拉开独立战争序幕。次年7月4日，杰斐逊起草的《独立宣言》通过，宣告“人人生而平等，享有不可剥夺的生命、自由与追求幸福之权”，十三条殖民地脱离英国。华盛顿率军苦战，萨拉托加成为转折，约克镇英军投降。1787年制宪会议确立三权分立的联邦共和，美国成为现代第一个大型立宪共和国。', source:'美国建国史' },
    { id:7, cat:'world', title:'明治维新：日本近代化', content:'1853年，美国佩里将军的“黑船”叩关，迫使锁国的日本打开国门，民族危机空前。倒幕派组成萨长同盟推翻幕府，1868年明治天皇重掌大权，开启全面变革：废藩置县加强集权，殖产兴业扶持工业，文明开化改用西历、兴办新式教育，更推行征兵制建立常备军。短短数十年，日本在甲午、日俄两战中接连获胜，跻身世界列强。然而急速扩张也埋下军国主义隐患，最终将国家引向深渊。', source:'日本近代史' },
    { id:8, cat:'world', title:'第一次世界大战的导火索', content:'19世纪末，欧洲裂为两大阵营：德、奥、意“三国同盟”对阵英、法、俄“三国协约”，军备竞赛愈演愈烈。巴尔干半岛民族矛盾深重，被称为“欧洲火药桶”。1914年6月，奥匈皇储斐迪南大公在萨拉热窝遇刺，奥匈对塞尔维亚宣战，各国依同盟条约相继动员，局部冲突瞬间演变为世界大战。西线陷入漫长的堑壕战，凡尔登、索姆河尸横遍野，最终四大帝国瓦解。凡尔赛和约看似终结战争，却以严苛条款埋下二战伏笔。',       source:'一战简史' },
    { id:31, cat:'world', title:'第二次世界大战的全面爆发', content:'20世纪30年代，大萧条重创各国经济，极端政治乘虚而入：希特勒借民族屈辱感上台，撕毁《凡尔赛和约》扩军；日本侵华、意大利入侵埃塞俄比亚。1939年德国闪击波兰，英法对德宣战，二战全面爆发。1941年苏德战争、珍珠港事件使战火蔓延全球。法西斯以种族灭绝与暴行震动人类，最终在反法西斯同盟（美英苏中）合力下于1945年败亡，战后联合国成立、雅尔塔体系重塑世界格局。', source:'二战史' },
    { id:32, cat:'world', title:'冷战：两大阵营的漫长对峙', content:'二战甫一结束，昔日的盟友美苏便因意识形态与势力范围反目。丘吉尔警告“铁幕落下”，欧洲裂为北约与华约两大军事集团。美国以马歇尔计划复兴西欧，苏联筑起东欧壁垒；柏林危机、古巴导弹危机几度把世界推到核战争边缘。这是一场没有大规模直接交火却遍布代理人战争、军备竞赛与太空竞赛的较量，直至1991年苏联解体，冷战方告终结，美国成为唯一超级大国。', source:'冷战史' },
    { id:33, cat:'world', title:'科学革命：从地心说到万有引力', content:'中世纪后期，人们对“地心说”的信仰开始松动。哥白尼提出“日心说”，撼动地球中心地位；伽利略以望远镜观测支持并遭教会审判；开普勒算出行星椭圆轨道。集大成的牛顿在《自然哲学的数学原理》中以三大运动定律与万有引力，把天上与地上的运动统一于同一套数学规律，并提出“实验—归纳—演绎”的方法论。科学革命由此开启，人类第一次相信：自然可被理性与数学精确认识。', source:'科学革命史' },
    { id:34, cat:'world', title:'宗教改革：撕裂西欧的信仰风暴', content:'16世纪初，罗马教廷为重建圣彼得大教堂兜售“赎罪券”，声称花钱可赎免罪罚，激起德意志修士路德的愤怒。1517年他将《九十五条论纲》贴于维滕贝格教堂门，主张“因信称义”、圣经权威高于教宗，点燃宗教改革。新教在诸侯支持下扩散，欧洲陷入长期宗教战争（三十年战争），《威斯特伐利亚和约》确立“教随国定”。改革瓦解了天主教会一统，也催生了个人阅读圣经、重视教育的现代精神。', source:'宗教改革史' },
    { id:35, cat:'world', title:'拿破仑与《民法典》', content:'法国大革命后政局动荡，炮兵军官拿破仑以政变上台，自任第一执政继而称帝。他横扫欧洲、重创封建秩序，却在埃及与俄国受挫；1815年滑铁卢一败涂地。但其《拿破仑法典》以法律面前人人平等、保护私有财产、废除封建特权为原则，随法军铁蹄播撒欧陆，成为现代民法的蓝本。他既是战争狂人，也是旧制度埋葬者——大革命所释放的“平等”理念，经他之手永久改变了欧洲。', source:'拿破仑时代' },
    { id:36, cat:'world', title:'美国内战：一场关于奴隶制的战争', content:'独立后的美国，北方工业资本与南方种植园奴隶制渐成水火：南方依赖黑奴劳动，北方主张自由劳工并担忧奴隶制扩张。1860年林肯当选，南方蓄奴州相继脱离。1861年萨姆特炮响，内战爆发。林肯以《解放宣言》将战争目标升华为废奴，葛底斯堡、维克斯堡转折连连，1865年南方投降。战后宪法第十三、十四修正案废奴并承认平等保护，却因重建失败埋下种族裂痕，奴隶制虽亡，歧视犹存。', source:'美国内战史' },
    { id:37, cat:'world', title:'俄国十月革命', content:'一战中沙俄伤亡惨重、经济崩溃，1917年二月革命已推翻沙皇，但临时政府继续参战、民生凋敝。列宁回国喊出“和平、土地、面包”，布尔什维克赢得工人士兵支持。11月（俄历10月）彼得格勒武装起义攻占冬宫，建立世界第一个社会主义国家。苏俄退出战争、将土地分给农民、工业收归国有。革命震动全球，催生共产国际，也开启了此后七十余年两极格局中的一极。', source:'俄国革命史' },
    { id:38, cat:'world', title:'大航海时代与殖民扩张', content:'1492年哥伦布横渡大西洋“发现”新大陆，1498年达·伽马绕过好望角抵印度，1522年麦哲伦船队完成环球航行——地球是圆的从此成为常识，世界史由此连为整体。欧洲列强竞相出海，建立殖民地、掠夺金银、贩运黑奴（三角贸易），美洲文明（阿兹特克、印加）在枪炮与瘟疫中倾覆。大航海带来全球贸易与物种交换，也开启了长达数百年的殖民掠夺，深刻塑造了当今世界的版图与贫富格局。', source:'全球史' },

    // 🇨🇳 中国历史 (15条)
    { id:9, cat:'china', title:'孔子与仁学', content:'春秋末期礼崩乐坏、诸侯混战，孔子（前551—前479）周游列国求仕而不得，晚年返鲁办学。他提炼出以“仁”为核心的思想——“仁者爱人”，强调“己所不欲，勿施于人”，并以“礼”维系社会秩序，主张中庸调和。他首创“有教无类”的私学，打破贵族垄断教育，弟子三千、贤者七十二。其言行由弟子辑为《论语》。西汉董仲舒“独尊儒术”后，儒家思想成为此后两千年中国的正统，也深刻塑造了整个东亚文化圈。', source:'《论语》' },
    { id:10, cat:'china', title:'秦始皇统一六国', content:'战国七雄长期征伐，秦国凭商鞅变法积蓄国力。公元前230至前221年，秦王嬴政以十年之功，依次灭韩、赵、魏、楚、燕、齐，终结数百年的分裂。他自称“始皇帝”，建立中央集权：废分封行郡县，设三公九卿；统一文字（小篆）、货币、度量衡与车轨；北筑长城御匈奴，南修灵渠通岭南。为控思想而焚书坑儒。秦虽二世而亡，但其制度范式被历代王朝沿用，奠定了中国大一统的政治根基。', source:'《史记》' },
    { id:11, cat:'china', title:'汉武帝的雄才大略', content:'汉初经历文景之治的休养生息，国库充盈。汉武帝刘彻（前141—前87在位）由此大展宏图：政治上颁“推恩令”削弱诸侯，设刺史监察地方；思想上采纳董仲舒建议“独尊儒术”，立太学培养官员；外交上派张骞两通西域，开辟丝绸之路；军事上命卫青、霍去病北击匈奴，收复河套与河西走廊；经济上行盐铁官营、统一币制。汉王朝由此成为当时世界上最强盛的国家之一。', source:'《汉书》' },
    { id:12, cat:'china', title:'贞观之治：李世民的治国智慧', content:'唐太宗李世民经玄武门之变即位后，以隋炀帝亡国为镜鉴，轻徭薄赋、与民休息。他用人唯才：房玄龄善谋、杜如晦能断，更难得的是容纳魏征等谏臣当面直陈其过。制度上完善三省六部与科举取士，让寒门也能入仕；民族政策开明，文成公主入藏和亲，被周边君主共尊为“天可汗”。史载当时“路不拾遗，夜不闭户”，贞观之治成为后世帝王向往的治世典范。', source:'《贞观政要》' },
    { id:13, cat:'china', title:'王安石变法', content:'北宋中期“积贫积弱”：官僚冗余、厢军庞杂，又要向辽、夏缴纳岁币，财政捉襟见肘。熙宁年间，王安石出任宰相推行新法——青苗法由官府低息贷粮给农、募役法改无偿差役为出钱代役、方田均税清丈田亩、保甲法编民为兵、市易法平抑物价，意在富国强兵。然而新法触动地主与保守派利益，司马光等旧党激烈反对，两派党争不绝。神宗崩后新法尽废，这场失败也映照出传统社会改革的深层阻力。', source:'《宋史》' },
    { id:14, cat:'china', title:'郑和下西洋', content:'明初国力鼎盛，成祖朱棣欲宣扬国威、亦传闻寻访建文帝下落，遂派郑和远航。郑和乃回族航海家，宝船规模空前，最大的长约百米、可载千人。自1405至1433年，他七下西洋，遍历东南亚、印度、阿拉伯，最远抵达东非沿岸，以瓷器丝绸换取珍宝，并确立朝贡秩序。这比哥伦布远航早了八十七年。可惜明清随之厉行海禁，中国主动退出了正在开启的大航海时代，错失了走向海洋的机遇。', source:'《明史》' },
    { id:15, cat:'china', title:'康乾盛世的辉煌与阴影', content:'康熙平定三藩、收复台湾、驱逐准噶尔、与沙俄订《尼布楚条约》；雍正设军机处、行摊丁入亩、改土归流；乾隆时有“十全武功”，并主持编纂《四库全书》。三朝（1661—1795）疆域辽阔、人口倍增、经济繁盛，奠定了现代中国版图的基础。然而盛世之下暗流涌动：后期闭关锁国错失世界变局，文字狱禁锢思想，人口压力与吏治腐化叠加。当西方轰鸣工业革命时，清王朝由盛转衰，为近代屈辱埋下伏笔。',       source:'清史讲座' },
    { id:39, cat:'china', title:'辛亥革命：两千年帝制的终结', content:'晚清内忧外患，戊戌变法失败、八国联军之辱使民族危机空前。孙中山提出“驱除鞑虏，恢复中华”，组织兴中会、同盟会，先后起义屡仆屡起。1911年武昌新军枪声一响，各省纷纷响应，清廷土崩瓦解。次年中华民国成立，清帝退位，两千年帝制终结。然而革命果实不久被袁世凯窃取，军阀混战继起。辛亥革命虽未竟全功，却推翻了皇权，使共和观念深入人心，是中国近代史的关键转折。', source:'中国近代史' },
    { id:40, cat:'china', title:'鸦片战争：近代屈辱的开端', content:'清中叶后闭关锁国、吏治腐化，而英国为扭转贸易逆差向中国大量走私鸦片，白银外流、兵民羸弱。林则徐虎门销烟后，1840年英舰炮轰广州，鸦片战争爆发。清军船坚炮利皆不及，战败订《南京条约》：割香港、开五口通商、赔巨款、协定关税。此为近代第一个不平等条约，中国开始沦为半殖民地。此后列强接踵而至，割地狂潮接二连三，天朝之梦就此破碎，也倒逼出洋务、维新等自救求索。', source:'中国近代史' },
    { id:41, cat:'china', title:'商鞅变法：秦统一的制度奠基', content:'战国诸侯兼并，秦国偏处西陲、被视为戎狄。商鞅携法家之学入秦，得秦孝公信用，展开彻底变法：废井田开阡陌，承认土地私有；奖励军功，依战功授爵，废除世卿世禄；推行县制、编户齐民、连坐什伍。秦国民风剽悍转为耕战机器，国力骤强。商鞅虽遭旧贵族车裂，其法却沿续不改，终使秦“奋六世之余烈”横扫六国。这套中央集权的耕战体制，正是秦统一后帝制的雏形。', source:'《史记·商君列传》' },
    { id:42, cat:'china', title:'赤壁之战：三分天下', content:'建安十三年，曹操基本统一北方后南征，率大军压境荆州，意图一举吞吴。孙权、刘备在鲁肃、诸葛亮穿引下结成联盟，周瑜督江东水师逆江而上。曹军北方士卒不习水战，又逢瘟疫，战船以铁索相连。黄盖诈降纵火，烈焰延烧连锁战船，曹军大溃，败走华容。此役奠定三分天下：曹操据北方，孙权守江东，刘备取荆益，鼎立之势成。赤壁因此成为中国历史上以少胜多、改变格局的经典战例。', source:'《三国志》' },
    { id:43, cat:'china', title:'安史之乱：盛唐由盛转衰', content:'唐玄宗开元盛世国力鼎盛，然晚年怠政，宠信李林甫、杨国忠，边镇节度使拥兵自重。安禄山兼领三镇、蓄谋已久，755年以“讨杨国忠”起兵反唐，连陷两京。玄宗仓皇入蜀，马嵬坡兵变赐死杨贵妃。郭子仪、李光弼借回纥之兵苦战八年方平叛乱。盛唐自此由盛转衰：藩镇割据、宦官专权、河西沦陷、经济重心南移。诗人杜甫亲历离乱，以“国破山河在”泣诉时代创伤，盛世余晖一去不返。', source:'《资治通鉴》' },
    { id:44, cat:'china', title:'洋务运动：师夷长技的尝试', content:'两次鸦片战争与太平天国重创清廷，部分官僚提出“师夷长技以自强”。1860年代起，曾国藩、李鸿章、左宗棠等办工厂（江南制造局）、造轮船、练新军、设同文馆、派幼童留美。北洋水师一度称雄东亚。然而洋务只学器物、不改制度，1894年甲午一战，北洋舰队覆没于日本，洋务运动宣告破产。《马关条约》割台赔款，举国震动，证明仅有坚船利炮不足以图存，制度变革的呼声由此高涨。', source:'晚清史' },
    { id:45, cat:'china', title:'五四运动：新文化的觉醒', content:'1919年巴黎和会，列强将德国在山东的权益转让日本，北洋政府屈辱签约的消息传回，举国哗然。5月4日北京学生云集天安门前，“外争主权，内除国贼”响彻云霄，旋即蔓延为全国罢课、罢工、罢市的群众运动，迫使拒签和约。运动同时是新文化的高潮：民主与科学被高举，白话文取代文言，马克思主义广泛传播。五四运动唤醒了民族觉醒，被视为中国现代史的开端，也为中国共产党的成立准备了思想土壤。', source:'中国现代史' },
    { id:46, cat:'china', title:'改革开放：中国的腾飞', content:'1978年，结束十年动荡的中国面临经济濒临崩溃、思想僵化之困。年底十一届三中全会确立“以经济建设为中心”，开启改革开放：农村推行家庭联产承包，城市兴办特区（深圳等）引资引技，逐步放开价格与民企。改革释放巨大活力，GDP长期高速增长，数亿人脱贫，基础设施与科技突飞猛进。这是自商鞅、清末以来最深刻的一次社会转型，中国重新融入世界体系，综合国力与国际地位今非昔比。', source:'当代中国经济史' },

    // 📕 毛选智慧 (7条)
    { id:16, cat:'mao', title:'《实践论》：认识依赖于实践', content:'“你要知道梨子的滋味，你就得变革梨子，亲口吃一吃。”理论必须结合实际。', source:'《毛选》第一卷' },
    { id:17, cat:'mao', title:'抓住主要矛盾', content:'“在复杂的事物的发展过程中，有许多的矛盾存在，其中必有一种是主要的矛盾。”', source:'《矛盾论》' },
    { id:18, cat:'mao', title:'调查研究就是解决问题', content:'“没有调查，没有发言权。”一切结论产生于调查情况的末尾，而不是在它的先头。', source:'《反对本本主义》' },
    { id:19, cat:'mao', title:'论持久战：战略分析范例', content:'毛泽东全面分析中日特点，驳斥“速胜论”与“亡国论”，指出战争是持久战。', source:'《论持久战》' },
    { id:20, cat:'mao', title:'群众路线的工作方法', content:'“从群众中来，到群众中去”，将分散意见集中起来，化为系统意见，再到群众中去。', source:'《关于领导方法的若干问题》' },
    { id:21, cat:'mao', title:'实事求是：根本原则', content:'“‘实事’就是客观事物，‘是’就是内部联系，‘求’就是我们去研究。”', source:'《改造我们的学习》' },
    { id:22, cat:'mao', title:'批评与自我批评', content:'“知无不言，言无不尽，言者无罪，闻者足戒，有则改之，无则加勉。”', source:'延安整风文献' },

    // 🤖 AI工作技巧 (8条)
    { id:23, cat:'ai', title:'高效 Prompt 公式', content:'明确角色+任务+格式+限制。例如：“你是资深编辑，将以下要点改写成200字新闻稿，语气专业。”', source:'AI提示工程' },
    { id:24, cat:'ai', title:'AI辅助阅读长文档', content:'将PDF交给AI：“总结核心观点，列出三个论据，并用表格对比”，压缩阅读时间。', source:'AI办公技巧' },
    { id:25, cat:'ai', title:'用AI头脑风暴', content:'让AI生成10个创意方向，再挑出3个深化。“给我10个提高学习动力的产品点子。”', source:'创造力工具' },
    { id:26, cat:'ai', title:'自动化邮件与报告', content:'通过AI+Zapier/快捷指令，自动生成周报、回复常规邮件，每天节省1—2小时。', source:'效率自动化' },
    { id:27, cat:'ai', title:'用AI学习新领域', content:'“我是初中生，请用简单比喻解释量子计算”，再让AI出题考你，快速入门。', source:'学习加速' },
    { id:28, cat:'ai', title:'AI帮你调试代码', content:'把报错信息复制给AI：“这段代码为什么报错？请指出原因并给出修改后代码。”', source:'开发者必备' },
    { id:29, cat:'ai', title:'会议纪要自动整理', content:'用AI转录会议录音，生成“议题、决定、待办事项”结构化纪要。', source:'会议效率' },
    { id:30, cat:'ai', title:'多语言翻译与润色', content:'先用AI直译，再让AI以目标语言母语者身份润色，搭配术语表效果更佳。', source:'翻译实践' }
  ];

  // 分类顺序
  const categories = ['world', 'china', 'mao', 'ai'];

  // ==================== 存储逻辑 ====================
  const LIB_KEY = 'learning_library_v4';
  function getLib() {
    try { return JSON.parse(localStorage.getItem(LIB_KEY)) || []; } catch(e) { return []; }
  }
  function saveLib(lib) {
    try { localStorage.setItem(LIB_KEY, JSON.stringify(lib)); } catch(e) {}
  }

  // ==================== 为每个分类计算今日条目 ====================
  function getTodayItemsByCategory() {
    const today = new Date().toISOString().split('T')[0]; // YYYY-MM-DD
    const seedBase = today.split('-').reduce((a,b)=>a+parseInt(b), 0);
    const result = {};
    categories.forEach((cat, idx) => {
      // 每个分类用自己的种子（seedBase + idx），保证每天每个分类稳定不同
      const seed = seedBase + idx * 7;
      const catItems = knowledgeBase.filter(item => item.cat === cat);
      if (catItems.length > 0) {
        const item = catItems[seed % catItems.length];
        result[cat] = item;
      }
    });
    return result;
  }

  // ==================== 远程知识拉取 ====================
  // 优先级：① 直连维基百科「历史上的今天」(CORS 开放，线上每日真实历史)
  //         ② 回退 ./today.json (由 GitHub Actions / 静态生成)
  //         ③ 再失败则走本地知识库
  // 本地双击 (file:) 直接走本地库
  const IS_LOCAL = (location.protocol === 'file:' || location.hostname === 'localhost');
  const REMOTE_JSON = './today.json';

  // 简易字符串哈希，用于生成稳定的远程条目 id（同一天内容不变则 id 不变，标记状态可跨刷新保持）
  function hashStr(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; }
    return h.toString(36);
  }

  const CN_KW = ['中国','中华','汉','唐','宋','元','明','清','秦','隋','北京','中原','华夏','三国','战国','春秋','秦始皇','周朝','商','辽','金','西夏','民国','长征','鸦片','慈禧'];
  function isChina(text) { return CN_KW.some(k => text.includes(k)); }
  function rnd(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  // ① 直连维基百科：历史上的今天（按 UTC 日期，保证全球同一天一致）
  // 加 4 秒超时：维基在中国大陆通常被墙，连接会长时间挂起，超时后直接回退，避免白屏
  async function fetchWikiToday() {
    const now = new Date();
    const mm = now.getUTCMonth() + 1;
    const dd = now.getUTCDate();
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 4000);
    try {
      const res = await fetch(`https://zh.wikipedia.org/api/rest_v1/feed/onthisday/events/${mm}/${dd}`, { cache: 'no-store', signal: ctrl.signal });
      if (!res.ok) return null;
      const j = await res.json();
      const events = j.events || [];
      if (!events.length) return null;
      const cn = events.filter(e => isChina(e.text));
      const world = events.filter(e => !isChina(e.text));
      const w = world.length ? rnd(world) : rnd(events);
      const c = cn.length ? rnd(cn) : rnd(events);
      const out = {};
      out.world = { id: 'wiki-world-' + hashStr(w.text), cat: 'world', title: '历史上的今天', content: w.text, source: '维基百科·历史上的今天' };
      out.china = { id: 'wiki-china-' + hashStr(c.text), cat: 'china', title: '历史上的今天', content: c.text, source: '维基百科·历史上的今天' };
      const maoArr = knowledgeBase.filter(k => k.cat === 'mao');
      const aiArr = knowledgeBase.filter(k => k.cat === 'ai');
      const m = rnd(maoArr), a = rnd(aiArr);
      out.mao = { id: 'wiki-mao-' + m.id, cat: 'mao', title: m.title, content: m.content, source: m.source };
      out.ai = { id: 'wiki-ai-' + a.id, cat: 'ai', title: a.title, content: a.content, source: a.source };
      return out;
    } catch (e) {
      return null;
    } finally {
      clearTimeout(timer);
    }
  }

  async function fetchRemoteKnowledge() {
    if (IS_LOCAL) return null; // 本地直接打开，跳过远程
    // ① 维基直连
    try {
      const wiki = await fetchWikiToday();
      if (wiki) return wiki;
    } catch (e) { console.warn('维基拉取失败，尝试回退', e); }
    // ② 回退 today.json
    try {
      const res = await fetch(REMOTE_JSON, { cache: 'no-store' });
      if (res.ok) {
        const data = await res.json();
        const result = {};
        for (const cat of ['world', 'china', 'mao', 'ai']) {
          if (data[cat]) {
            result[cat] = {
              id: 'remote-' + cat + '-' + hashStr((data[cat].title || '') + '|' + (data[cat].content || '')),
              cat: cat,
              title: data[cat].title,
              content: data[cat].content,
              source: data[cat].source || "线上摘录"
            };
          }
        }
        if (Object.keys(result).length === 4) return result;
      }
    } catch (e) { console.warn('today.json 拉取失败', e); }
    return null; // 最终回退本地库
  }

  // 仅拉取 ./today.json（由 GitHub Actions 每日生成），用于静默自动应用「当天真实历史」
  // 不碰维基、加 4 秒超时：仅当 date 为今天才应用，今天内多次加载一致 → 稳定不跳动
  async function loadTodayJson() {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 4000);
    try {
      const res = await fetch(REMOTE_JSON, { cache: 'no-store', signal: ctrl.signal });
      if (!res.ok) return null;
      const data = await res.json();
      const result = { date: data.date };
      for (const cat of ['world', 'china', 'mao', 'ai']) {
        if (data[cat]) {
          result[cat] = {
            id: 'remote-' + cat + '-' + hashStr((data[cat].title || '') + '|' + (data[cat].content || '')),
            cat: cat,
            title: data[cat].title,
            content: data[cat].content,
            source: data[cat].source || '线上摘录'
          };
        }
      }
      if (Object.keys(result).length < 5) return null; // 需要 date + 4 块
      return result;
    } catch (e) { return null; }
    finally { clearTimeout(timer); }
  }

  function toggleMarkById(id) {
    let lib = getLib();

    } else {
      const item = todayMap[String(id)] || knowledgeBase.find(k => String(k.id) === String(id));
      if (item) {
        lib.push({

  // 初始渲染：单一数据源（内嵌库 + 日期轮换），本地与线上完全一致，永不自动跳动
  function initApp() {

    // 静默自动应用「当天真实历史」：GitHub Actions 每日生成的 today.json
    // 仅当 date==今天 才应用；今天内多次加载一致，稳定不跳动
    const dayKey = () => new Date().toISOString().slice(0, 10);
    if (!IS_LOCAL) {
      loadTodayJson().then(remote => {
        if (remote && remote.date === dayKey()) {
          todayItems = remote;
          rebuildTodayMap();
          const todayTab = document.querySelector('.tab[data-tab="today"]');
          if (!todayTab || todayTab.classList.contains('active')) renderToday();
          updateLibCount();
        }
      });
    }

    // 跨天自动刷新：日期变化自动切换到当天内容（本地库 + 新的 today.json）
    let _lastDate = dayKey();
    setInterval(() => {
      const d = dayKey();
      if (d === _lastDate) return;
      _lastDate = d;
      todayItems = getTodayItemsByCategory();
      rebuildTodayMap();
      const todayTab = document.querySelector('.tab[data-tab="today"]');
      if (todayTab && todayTab.classList.contains('active')) renderToday();
      updateLibCount();
      // 跨天后尝试拉取新日期的 today.json
      if (!IS_LOCAL) {
        loadTodayJson().then(remote => {
          if (remote && remote.date === d) {
            todayItems = remote;
            rebuildTodayMap();
            if (!todayTab || todayTab.classList.contains('active')) renderToday();
            updateLibCount();
          }
        });
      }
    }, 60000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initApp);
  } else {
    initApp();
  }

  // 清除旧的 Service Worker 缓存（避免缓存旧页面导致白屏）；本站内容每日更新，无需离线缓存
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistration().then(reg => { if (reg) reg.unregister(); }).catch(() => {});
  }
})();
</script>
</body>
</html>
